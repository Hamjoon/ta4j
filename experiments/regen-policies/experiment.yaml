name: ta4j-regen-policies
project:
  repo: /Users/donggi/_projects/experiment-projects/ta4j
  language: java
  build: maven
  module: ta4j-core
  test_framework: junit4
anchor: 897a114c2c74413d05a7a2091efb0fe3611b0036
range:
  branch: origin/master
  end: 7adc45bfdf78aae2c07f4008b8bb939eac0aea6b
  mode: first-parent
  limit: null
  skip_untouched: module
scope:
  rule: explicit
  rank_by: change-count
  min_methods: 3
  exclude_accessor_heavy: true
  target_methods:
  - 50
  - 80
  max_classes: 10
  classes:
  - org.ta4j.core.indicators.numeric.NumericIndicator
  - org.ta4j.core.Position
  - org.ta4j.core.backtest.BarSeriesManager
  - org.ta4j.core.analysis.CashFlow
  - org.ta4j.core.indicators.ATRIndicator
  min_classes: 1
dev:
  stable_runs: 3
  groups:
  - name: dev
    denominator: project
  - name: dev-scope
    display: Dev (scope)
    denominator: scope-targeted
    derive_from: dev
model:
  provider: openrouter
  name: openai/gpt-oss-120b
  env_file: /Users/donggi/_projects/experiment-projects/KTester/docker/.env
  env_key: OPENROUTER_API_KEY
generators:
- name: ktester
  display: KTester
  method: ktester
  impl: author-tool
  tool_path: /Users/donggi/_projects/experiment-projects/KTester
  docker:
    compose_files:
    - /Users/donggi/_projects/experiment-projects/KTester/docker/compose.yml
    - /Users/donggi/_projects/experiment-projects/KTester/docker/compose.ta4j.yml
    service: ktester
    mounts:
      /Users/donggi/_projects/experiment-projects/ta4j: /repo
      /Users/donggi/_projects/experiment-projects/KTester: /work
  params:
    fix_tries: 5
    temperature: 0.5
    workers: 8
  rounds:
    max: 1
- name: ouedraogo
  display: "Ou\xE9draogo"
  method: ouedraogo
  impl: native
  params:
    prompts:
    - ZSL
    - FSL
    - CoT
    - ToT
    - GToT
    temperature: 0.7
    max_tokens: 16384
  rounds:
    max: 2
    until_dev_matched: false
    stop_after_zero_compile: 2
  context:
    dependency_signatures:
      enabled: true
      max_types: 15
      max_lines: 400
  prompt:
    api_constraint: true
  postprocess:
    import_repair:
      enabled: true
      passes: 2
screen:
  stable_runs: 3
  dedup: exact-body
  matching: none
survival:
  definition: cumulative-fixed-denominator
  flaky_rerun: 1
  build_fail: carry-over
  environment_errors:
    patterns:
    - java.net.BindException
    max_reruns: 3
    backoff_seconds: 5
coverage:
  changed_line: true
  at_anchor: true
  groups: alive-entering
runner:
  docker:
    image: survival-java:25
    mounts:
      /Users/donggi/_projects/experiment-projects/ta4j: /repo
    env_file: /Users/donggi/_projects/experiment-projects/KTester/docker/.env
  javac_mode: reused-jvm          # JDK 25 runner: reuse compiler JVMs (results identical in the 10-29 check)
  reuse:
    checkouts: null
    classpath_cache: null
  workers:                        # 4 while other experiments run concurrently (Docker ~11.7 GB)
    build: 4
    survive: 4
    cover: 4
  timeouts:
    build: 600
    compile: 300
    test_class: 120
  jvm:
    launcher: 1g
    javac: 512m
    jacoco: 1g
  cache:
    classpath: pom-sha256
    node_modules: lockfile-sha256
policies:
  regenerate_developer: false
  baseline: experiments/commit-survival
  baseline_config: null
  groups:
  - dev-scope
  - ouedraogo
  releases:
  - 0.22.0
  - 0.23.0
  threshold: 0.5
  max_threshold_triggers: 1
  generator_overrides: {}
  concurrency:
    ouedraogo: 3
    dev_selection: 1
  fill_seed: 20261029
  set:
  - name: release-reset
    trigger: release
    action: reset
  - name: half-reset
    trigger: threshold
    action: reset
  - name: half-fill
    trigger: threshold
    action: fill
