name: ta4j-core-commit-survival

project:
  repo: /Users/donggi/_projects/experiment-projects/ta4j
  language: java
  build: maven
  module: ta4j-core
  test_framework: junit4

anchor: "897a114c2c74413d05a7a2091efb0fe3611b0036"   # master first-parent merge of release/0.16 (2024-05-17). ta4j-core tree identical to tag 0.16, which itself is off the first-parent line
range:
  branch: origin/master
  end: 7adc45bfdf78aae2c07f4008b8bb939eac0aea6b
  mode: first-parent
  limit: null
  skip_untouched: module

scope:
  rule: explicit                # dedicated-test picked only DecimalNum (50 methods, dev-scope 6); chosen by hand instead
  rank_by: change-count
  min_methods: 3
  exclude_accessor_heavy: true
  target_methods: [50, 80]
  max_classes: 10
  classes:                      # m = focal methods, d = dedicated test methods, c = changing commits (population/class-survey.csv)
    - org.ta4j.core.indicators.numeric.NumericIndicator   # m 38, d 15, c 12
    - org.ta4j.core.Position                              # m 25, d 27, c 9
    - org.ta4j.core.backtest.BarSeriesManager             # m 9,  d 7,  c 14
    - org.ta4j.core.analysis.CashFlow                     # m 7,  d 16, c 14
    - org.ta4j.core.indicators.ATRIndicator               # m 5,  d 2,  c 15
  min_classes: 1

dev:
  stable_runs: 3
  groups:
    - name: dev
      denominator: project
    - name: dev-scope
      display: "Dev (scope)"
      denominator: scope-targeted
      derive_from: dev

model:
  provider: openrouter
  name: openai/gpt-oss-120b
  env_file: /Users/donggi/_projects/experiment-projects/KTester/docker/.env
  env_key: OPENROUTER_API_KEY

generators:
  - name: ktester
    display: KTester
    method: ktester
    impl: author-tool
    tool_path: /Users/donggi/_projects/experiment-projects/KTester
    docker:
      compose_files:
        - /Users/donggi/_projects/experiment-projects/KTester/docker/compose.yml
        - /Users/donggi/_projects/experiment-projects/KTester/docker/compose.ta4j.yml
      service: ktester
      mounts:
        /Users/donggi/_projects/experiment-projects/ta4j: /repo
        /Users/donggi/_projects/experiment-projects/KTester: /work
    params: {fix_tries: 5, temperature: 0.5, workers: 8}
    rounds: {max: 1}

  - name: ouedraogo
    display: Ouédraogo
    method: ouedraogo
    impl: native
    params: {prompts: [ZSL, FSL, CoT, ToT, GToT], temperature: 0.7, max_tokens: 16384}
    rounds: {max: 2, until_dev_matched: false, stop_after_zero_compile: 2}
    context:
      dependency_signatures: {enabled: true, max_types: 15, max_lines: 400}
    prompt:
      api_constraint: true
    postprocess:
      import_repair: {enabled: true, passes: 2}

screen:
  stable_runs: 3
  dedup: exact-body
  matching: none

survival:
  definition: cumulative-fixed-denominator
  flaky_rerun: 1
  build_fail: carry-over
  environment_errors:
    patterns: ["java.net.BindException"]
    max_reruns: 3
    backoff_seconds: 5

coverage:
  changed_line: true
  at_anchor: true
  groups: alive-entering

runner:
  docker:
    image: survival-java:25
    mounts:
      /Users/donggi/_projects/experiment-projects/ta4j: /repo
    env_file: /Users/donggi/_projects/experiment-projects/KTester/docker/.env
  reuse:
    checkouts: null
    classpath_cache: null
  workers: {build: 4, survive: 6, cover: 6}
  timeouts: {build: 600, compile: 300, test_class: 120}
  jvm: {launcher: 1g, javac: 512m, jacoco: 1g}
  cache: {classpath: pom-sha256, node_modules: lockfile-sha256}
